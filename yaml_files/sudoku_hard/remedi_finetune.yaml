# ============================================================
# RemeDi SFT fine-tuning config — sudoku_hard (n=3)
#
# Reference: arXiv:2509.23653
#   "Don't Settle Too Early: Self-Reflective Remasking for
#    Diffusion Language Models"
#
# Usage:
#   torchrun --nproc_per_node=1 -m remedi.train \
#       --config-path ../yaml_files/sudoku_hard \
#       --config-name remedi_finetune \
#       remedi.pretrained_ckpt=/path/to/step_N.pt
# ============================================================

# ---- backbone (identical to base.yaml) ----
model:
  vocab_size: 11
  hidden_size: 256
  intermediate_size: 768
  num_layers: 8
  num_attention_heads: 8
  num_kv_heads: 8
  max_position: 162
  rms_norm_eps: 1e-6
  dropout: 0.0

# ---- RemeDi-specific settings ----
remedi:
  pretrained_ckpt: "none"         # set via CLI: remedi.pretrained_ckpt=...

  # UPS architecture: tap layers (0-indexed) in the 8-layer backbone.
  # Scaled from the paper's [0,10,20,30] in a ~32-layer model:
  #   0%,31%,62%,94% depth → layers 1,3,5,7 in an 8-layer model.
  ups_positions: [1, 3, 5, 7]

  # SFT training
  incorrect_ratio: 0.1            # r in the paper: rho_incorrect = 4*r*t*(1-t)
  lambda_ups: 0.3                 # lambda_UPS in Eq. (5)
  tune_backbone: true             # jointly fine-tune TPS + UPS
  backprop_warmup_steps: 0     # (non-paper) freeze backprop_linears for first N steps; 0 = disabled
  tps_lr: 1e-5
  ups_lr: 1e-4

  # Inference (maple-research-lab/RemeDi inference.py: TPS gather + argmax)
  use_ups: false                 # true = rank by UPS head (paper prose)

# ---- training ----
training:
  strategy: "standard"
  confidence_threshold: 0.9
  mode: "standard"
  learning_rate: 1e-5
  weight_decay: 0.01
  num_epochs: 100
  max_steps: 20000                # same budget as PRISM for fair comparison
  max_grad_norm: 1.0
  batch_size: 256
  lr_scaling_mode: "constant"
  warmup_steps: 500
  logging_steps: 100
  eval_steps: 1000
  save_steps: 5000
  ema: null
  eos_id: null

validation:
  batch_size: 1024
  val_dir: "data/sudoku_hard"
  ratio: 1
  sampling:
    temperature: 0.0
    confidence: "top_k"
    unmasking_num: 1
  track: false

data:
  mask_id: 10
  dataset: "sudoku"
  data_dir: ${validation.val_dir}
  sudoku_type: "preprocessed"
  val_ratio: 0.001
  seed: 123
  mmap: false
  training:
    cpus: 4

wandb:
  wandb: true
  project: "sudoku_hard-pretraining-corrected"
  name: "remedi-finetune-s${data.seed}"
  entity: "your-entity-here"
