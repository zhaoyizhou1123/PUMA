# ============================================================
# PRISM fine-tuning config — sudoku_hard (n=3)
#
# Usage:
#   torchrun --nproc_per_node=1 -m prism.train \
#       --config-path ../yaml_files/sudoku_hard \
#       --config-name prism_finetune \
#       prism.pretrained_ckpt=/path/to/step_N.pt
# ============================================================

# ---- backbone (identical to base.yaml) ----
model:
  vocab_size: 11
  hidden_size: 256
  intermediate_size: 768
  num_layers: 8
  num_attention_heads: 8
  num_kv_heads: 8
  max_position: 162
  rms_norm_eps: 1e-6
  dropout: 0.0

# ---- PRISM-specific adapter + algorithm settings ----
prism:
  pretrained_ckpt: "none"         # set via CLI: prism.pretrained_ckpt=...
  adapter_hidden: 64              # hidden dim of the two-layer adapter MLP
  num_demasking_tokens: 4         # k=4 per paper (finetune_sudoku_prism.sh)
  reg_lambda: 5.0                 # per paper (finetune_sudoku_prism.sh)
  tune_backbone: true             # per paper: backbone fine-tuned jointly
  # inference / PRISM-sampling settings
  num_remask: 4                   # per paper (sample_sudoku_prism.sh)
  step_on: 0                      # per paper
  step_off: 999999                # effectively always on (paper uses step_off=51=all steps)

# ---- training ----
training:
  strategy: "standard"            # used only for logging; actual loss is PRISM
  confidence_threshold: 0.9
  mode: "standard"
  learning_rate: 3e-4
  weight_decay: 0.01
  num_epochs: 100                 # upper bound; max_steps takes precedence
  max_steps: 20000                # per paper (finetune_sudoku_prism.sh)
  max_grad_norm: 1.0
  batch_size: 256                 # per paper
  lr_scaling_mode: "constant"     # paper uses fixed 3e-4 regardless of batch size
  warmup_steps: 500
  logging_steps: 100
  eval_steps: 1000
  save_steps: 5000
  ema: null
  eos_id: null

validation:
  batch_size: 1024
  val_dir: "data/sudoku_hard"
  ratio: 1
  sampling:
    temperature: 0.0
    confidence: "top_k"
    unmasking_num: 1
  track: false

data:
  mask_id: 10
  dataset: "sudoku"
  data_dir: ${validation.val_dir}
  sudoku_type: "preprocessed"
  val_ratio: 0.001
  seed: 123
  mmap: false
  training:
    cpus: 4

wandb:
  wandb: true
  project: "sudoku_hard-pretraining-corrected"
  name: "prism-finetune-s${data.seed}"
  entity: "your-entity-here"
