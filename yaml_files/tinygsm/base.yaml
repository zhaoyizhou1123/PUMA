model:
  vocab_size: 151645
  hidden_size: 512
  intermediate_size: 1536
  num_layers: 14
  num_attention_heads: 8
  num_kv_heads: 8
  max_position: 512
  rms_norm_eps: 1e-6
  dropout: 0.0
  tie_lm_head: true # we tie the weights as QWen2 vocab size ~ 150k
  causal: false      # if true, uses causal attention mask
  arm_init: "none" # initialize MDM from ARM. Set to "none" to disable

training:
  strategy: "progressive"
  mode: "confidence_collapse"
  confidence_threshold: 0.9
  eos_id: 151643
  K: 12
  block_size: 256
  k_schedule:
    - [12, 0]
    - [15, 30000]
    - [18, 60000]
    - [21, 90000]
    - [24, 120000]
    - [27, 150000]
    - [30, 180000]
    - [33, 210000]
    - [36, 240000]
    - [39, 270000]
    - [42, 300000]
  data_ratio: 1.0
  learning_rate: 3e-4
  weight_decay: 0.01
  num_epochs: 20
  max_grad_norm: 1.0
  batch_size: 256
  warmup_steps: 1000
  logging_steps: 100
  eval_steps: 5000
  save_steps: 10000
  ema: 0.9999 # same as MDLM. Leave empty to disable EMA

validation:
  val_dir: "none" # gsm8k eval loop is self-included
  sampling:
    temperature: 0.0
    confidence: ["top_k"]
    unmasking_num: [2, 3]
    eos_id: 151643
  
data:
  mask_id: 151644
  dataset: "tinygsm"
  data_dir: "/projects/bgqz/zzhou24/data/tinygsm"
  val_ratio: 0.02
  seed: 2026
  training:
    # per_gpu_batch_size: set automatically in train script as batch_size // world_size
    cpus: 4

wandb:
  wandb: true
  project: "mdm-pretraining"
  name: "puma"
  entity: "your-entity-here"
