model:
  vocab_size: 11
  hidden_size: 256
  intermediate_size: 768
  num_layers: 8
  num_attention_heads: 8
  num_kv_heads: 8
  max_position: 162
  rms_norm_eps: 1e-6
  dropout: 0.0

training:
  strategy: "progressive_edit"
  confidence_threshold: 0.9
  mode: "standard" # [standard, x0, mixed]
  K: 64
  data_ratio: 1.0
  learning_rate: 3e-4
  weight_decay: 0.01
  num_epochs: 6
  max_grad_norm: 1.0
  batch_size: 128 # This should now be global batch size
  warmup_steps: 1000
  logging_steps: 100
  eval_steps: 5000
  save_steps: 10000
  ema: null
  eos_id: null

validation:
  val_dir: "data/sudoku_new"
  ratio: 0.01
  sampling: 
    temperature: 0.0
    confidence: ["top_k"]
    unmasking_num: [1]
    edit_freq: 3
    edit_step: [1, 4, 8]
  track: true

data:
  mask_id: 10
  dataset: "sudoku"
  data_dir: "data/sudoku_new"
  sudoku_type: "new"
  val_ratio: 0.05
  seed: 2026
  mmap: false
  training:
    # per_gpu_batch_size: ${training.batch_size} # This will be set in the training script based on the world size
    cpus: 4

wandb:
  wandb: true
  project: "puma-mdm-pretraining"
  name: "sudoku-puma-edit-v3-K64"
  entity: "your-entity-here"